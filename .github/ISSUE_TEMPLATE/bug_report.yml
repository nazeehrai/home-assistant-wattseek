name: Bug report
description: Report a reproducible WattSeek integration problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WattSeek. Remove passwords, tokens, email addresses, plant addresses, device IDs and full serial numbers before submitting.
  - type: input
    id: version
    attributes:
      label: WattSeek integration version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.3
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter manufacturer and model
      description: Do not include its serial number or device ID.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Change...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or diagnostics
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Privacy and checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and identifying account/device information.
          required: true

