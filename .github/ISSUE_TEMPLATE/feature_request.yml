name: Feature request
description: Suggest an improvement or additional inverter capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem should the feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter manufacturer and model
      description: Optional. Do not include serial numbers or device IDs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Any attached captures have credentials and identifying information removed.
          required: true

